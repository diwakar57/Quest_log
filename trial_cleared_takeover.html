<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trial Cleared — Takeover</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Share+Tech+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050709; --panel:#0D1117; --line:#1C2733; --cyan:#3FA9E0; --cyan-dim:#1E4A63;
    --text:#DDE6EE; --text-dim:#5C6B7A;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center;}
  .stage{max-width:400px; width:100%; padding:20px;}
  .replay-btn{
    display:block; margin:20px auto 0; background:none; border:1px solid var(--line);
    color:var(--text-dim); font-family:'Share Tech Mono',monospace; font-size:11px;
    letter-spacing:1px; padding:8px 16px; text-transform:uppercase;
  }

  .overlay{
    position:relative; background:rgba(5,7,9,0.96); border:1px solid var(--cyan);
    padding:0; overflow:hidden; opacity:0; transform:scale(0.97);
    animation:appear 0.5s ease forwards;
  }
  @keyframes appear{ to{ opacity:1; transform:scale(1); } }

  .overlay::before, .overlay::after,
  .overlay .bl, .overlay .br{
    content:''; position:absolute; width:14px; height:14px; border:1.5px solid var(--cyan); z-index:2;
  }
  .overlay::before{top:-1px; left:-1px; border-right:none; border-bottom:none;}
  .overlay::after{top:-1px; right:-1px; border-left:none; border-bottom:none;}
  .overlay .bl{bottom:-1px; left:-1px; border-right:none; border-top:none;}
  .overlay .br{bottom:-1px; right:-1px; border-left:none; border-top:none;}

  .scanline{
    position:absolute; left:0; top:0; width:100%; height:2px; background:var(--cyan);
    opacity:0.8; animation:scan 1.4s ease-in-out infinite;
  }
  @keyframes scan{ 0%{ top:0; opacity:0.8; } 50%{ opacity:0.2; } 100%{ top:100%; opacity:0.8; } }

  .ov-head{
    text-align:center; padding:28px 20px 18px; border-bottom:1px solid var(--line);
    position:relative;
  }
  .ov-eyebrow{
    font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-dim);
    letter-spacing:3px; text-transform:uppercase; margin:0 0 10px;
  }
  .ov-title{
    font-family:'Orbitron',sans-serif; font-size:26px; font-weight:700; letter-spacing:3px;
    color:var(--cyan); margin:0; text-transform:uppercase;
  }
  .ov-sub{font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--text-dim); margin:8px 0 0;}

  .ov-body{padding:20px;}

  .tier-line{
    display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:20px;
    font-family:'Orbitron',sans-serif; font-size:14px;
  }
  .tier-box{
    border:1px solid var(--line); padding:8px 14px; text-align:center; flex:1;
  }
  .tier-box .lbl{font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px;}
  .tier-box .val{font-size:16px; color:var(--text-dim);}
  .tier-box.next .val{color:var(--cyan);}
  .tier-box.next{border-color:var(--cyan);}
  .arrow{color:var(--cyan); font-size:18px;}

  .divider{display:flex; align-items:center; gap:8px; margin:18px 0 10px;}
  .divider::before, .divider::after{content:''; flex:1; height:1px; background:var(--line);}
  .divider span{font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--cyan); letter-spacing:2px; text-transform:uppercase;}

  .criteria-line{
    display:flex; align-items:center; gap:10px; padding:6px 0;
    font-family:'Share Tech Mono',monospace; font-size:12px; color:var(--text-dim);
  }
  .criteria-line i{color:var(--cyan); font-size:15px;}

  .reward-row{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); margin-top:4px;}
  .reward-cell{background:var(--panel); padding:10px 12px; text-align:center;}
  .reward-cell .lbl{font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px;}
  .reward-cell .num{font-family:'Orbitron',sans-serif; font-size:17px; font-weight:600; color:var(--cyan); margin-top:2px;}

  .dismiss-btn{
    width:100%; background:none; border:1px solid var(--cyan); color:var(--cyan);
    font-family:'Share Tech Mono',monospace; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    padding:12px; margin-top:20px; cursor:pointer;
  }
  .dismiss-btn:active{background:var(--cyan); color:var(--bg);}
</style>
</head>
<body>
<div class="stage">
  <div class="overlay" id="overlay">
    <div class="scanline"></div>
    <div class="bl"></div><div class="br"></div>
    <div class="ov-head">
      <p class="ov-eyebrow">System notification</p>
      <p class="ov-title">Trial cleared</p>
      <p class="ov-sub">You proved it. Not just logged it.</p>
    </div>
    <div class="ov-body">
      <div class="tier-line">
        <div class="tier-box"><div class="lbl">Tier</div><div class="val">03</div></div>
        <span class="arrow">›</span>
        <div class="tier-box next"><div class="lbl">Tier</div><div class="val">04</div></div>
      </div>

      <div class="divider"><span>Cleared criteria</span></div>
      <div class="criteria-line"><i class="ti ti-check"></i>8 clean knee push-ups</div>
      <div class="criteria-line"><i class="ti ti-check"></i>20-second dead hang</div>

      <div class="divider"><span>Rewards</span></div>
      <div class="reward-row">
        <div class="reward-cell"><div class="lbl">XP earned</div><div class="num">+120</div></div>
        <div class="reward-cell"><div class="lbl">Pool unlocked</div><div class="num">Tier 4</div></div>
      </div>

      <button class="dismiss-btn">[ Continue ]</button>
    </div>
  </div>

  <button class="replay-btn" onclick="const o=document.getElementById('overlay'); o.style.animation='none'; void o.offsetWidth; o.style.animation='appear 0.5s ease forwards';">↻ Replay entrance</button>
</div>
</body>
</html>
